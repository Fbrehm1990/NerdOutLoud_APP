<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NerdOutLoud — Promo Teaser</title>
<style>
  @font-face {
    font-family: 'Bebas Neue';
    src: local('Bebas Neue');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(ellipse 90% 70% at 50% 35%, #1B2040 0%, #0D0F1E 65%);
    font-family: 'Karla', -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .stage { position: relative; width: 1200px; height: 630px; display: flex; align-items: center; justify-content: center; }

  .filmstrip { position: absolute; top: 0; left: 0; right: 0; height: 26px; background: #080A16; display: flex; gap: 14px; align-items: center; justify-content: center; }
  .filmstrip span { width: 10px; height: 12px; border-radius: 2px; background: #232849; flex-shrink: 0; }
  .filmstrip.bottom { top: auto; bottom: 0; }

  .bulbrow { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; }
  .bulbrow.top { top: 60px; }
  .bulbrow.bottom { bottom: 60px; }
  .bulb { width: 10px; height: 10px; border-radius: 50%; background: #FFB627; animation: chase 1.6s infinite; }
  @keyframes chase { 0%, 100% { opacity: .2; box-shadow: none; } 50% { opacity: 1; box-shadow: 0 0 14px #FFB627, 0 0 28px rgba(255,182,39,.5); } }

  .center { text-align: center; animation: flicker 6s infinite; }
  @keyframes flicker { 0%, 91%, 100% { opacity: 1; } 93% { opacity: .5; } 95% { opacity: .9; } }

  h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: 118px; letter-spacing: 10px; color: #F0F1FA;
    text-shadow: 0 0 40px rgba(255,182,39,.3); line-height: 1;
    opacity: 0; animation: riseIn 1s ease 0.3s forwards;
  }
  h1 .out { color: #FFB627; text-shadow: 0 0 34px rgba(255,182,39,.7); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

  .tagline {
    margin-top: 18px; font-size: 20px; letter-spacing: 10px; text-transform: uppercase; color: #9CA2C7;
    opacity: 0; animation: riseIn 1s ease 1.1s forwards;
  }
  .catch {
    margin-top: 20px; font-size: 22px; font-style: italic; color: #FFD37A;
    opacity: 0; animation: riseIn 1s ease 1.9s forwards;
  }
  .cta {
    margin-top: 34px; display: inline-block; font-family: 'Bebas Neue', sans-serif; font-size: 26px;
    letter-spacing: 4px; background: #FFB627; color: #14120A; padding: 14px 40px 10px; border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,182,39,.4);
    opacity: 0; animation: popIn 0.6s ease 2.7s forwards;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="filmstrip top">
      <script>document.write('<span></span>'.repeat(80));</script>
    </div>
    <div class="filmstrip bottom">
      <script>document.write('<span></span>'.repeat(80));</script>
    </div>
    <div class="bulbrow top">
      <span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.4s"></span>
      <span class="bulb" style="animation-delay:.8s"></span><span class="bulb" style="animation-delay:1.2s"></span>
      <span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.4s"></span>
      <span class="bulb" style="animation-delay:.8s"></span><span class="bulb" style="animation-delay:1.2s"></span>
    </div>
    <div class="center">
      <h1>NERD<span class="out">OUT</span>LOUD</h1>
      <div class="tagline">Stop scrolling &middot; Start watching</div>
      <div class="catch">We pick your movie. You call your rating. Nerdmunity settles the debate.</div>
      <div class="cta">SPIN YOUR NEXT MOVIE →</div>
    </div>
    <div class="bulbrow bottom">
      <span class="bulb" style="animation-delay:.8s"></span><span class="bulb" style="animation-delay:1.2s"></span>
      <span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.4s"></span>
      <span class="bulb" style="animation-delay:.8s"></span><span class="bulb" style="animation-delay:1.2s"></span>
      <span class="bulb" style="animation-delay:0s"></span><span class="bulb" style="animation-delay:.4s"></span>
    </div>
  </div>
</body>
</html>
