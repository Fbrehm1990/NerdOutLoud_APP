<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NerdOutLoud — Stop scrolling. Start watching.</title>
    <meta name="description" content="NerdOutLoud picks your movie, takes your before-and-after ratings, and gets you talking about it with Nerdmunity — the community that settles the debate." />
    <meta name="theme-color" content="#0D0F1E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NerdOutLoud" />

    <!-- Open Graph / social share preview -->
    <meta property="og:title" content="NerdOutLoud — Stop scrolling. Start watching." />
    <meta property="og:description" content="We pick your movie. You call your rating. Nerdmunity settles the debate." />
    <meta property="og:image" content="/promo-static-1200x630.png" />
    <meta property="og:type" content="website" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/logo-mark-512.png" />

    <!--
      ============ Google Search Console ============
      Get your verification snippet from search.google.com/search-console
      (Settings → Ownership verification → HTML tag) and paste the content
      value below. Leave as-is (harmless) if you're not using GSC yet.
    -->
    <meta name="google-site-verification" content="PASTE_YOUR_GSC_VERIFICATION_CODE_HERE" />

    <!--
      ============ Google Analytics (GA4) ============
      Get your Measurement ID from analytics.google.com (Admin → Data Streams
      → your web stream → Measurement ID, looks like "G-XXXXXXXXXX").
      Replace G-XXXXXXXXXX in BOTH places below.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!--
      ============ Microsoft Clarity ============
      Get your Project ID from clarity.microsoft.com (Settings → Setup →
      Install tracking code). Replace YOUR_CLARITY_ID below.
    -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "YOUR_CLARITY_ID");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
